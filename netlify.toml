# ============================================
# Redirects
# ============================================

# Redirect /cartas a /app (legacy)
[[redirects]]
  from = "/cartas"
  to = "/app"
  status = 301

[[redirects]]
  from = "/cartas/*"
  to = "/app"
  status = 301

