<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>La Mirada Creativa · Campaña</title>
<link rel="icon" href="/assets/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Back-office · MISMA MARCA que la landing (lamiradacreativa.com).
     Tokens tomados de css/redesign.css: superficie clara + rejilla, cards
     blancas flotantes (borde + sombra suave, radios grandes), azul de marca,
     ámbar CTA, Plus Jakarta Sans. Semántica coral/verde/ámbar.

     Construcción: flex + gap (separación solo por gap, nunca margins).
     Escala de espaciado fija. Iconos Lucide inline (cero deps JS).
     REGLA: nunca clases 'ad'/'adlist' (los ad-blockers las ocultan).
     ============================================================ */
  :root{
    /* escala de espaciado — única fuente de separación */
    --s2:2px;  --s3:3px;  --s4:4px;  --s6:6px;   --s8:8px;   --s10:10px;
    --s12:12px;--s16:16px;--s20:20px;--s24:24px; --s32:32px; --s40:40px;
    --s48:48px;--s60:60px;--s80:80px;--s120:120px;
    /* color — de la landing */
    --bg:#FFFFFF; --bg-2:#F5F6F8; --ink:#0B0B0D; --ink-2:#1A1B1F;
    --muted:#6A6F79; --muted-2:#9AA0AA;
    --line:#E7E9ED; --line-soft:rgba(11,11,13,.06); --grid:rgba(22,40,90,.05);
    --blue:#2F6BFF; --blue-600:#1E56F0; --blue-050:#EAF1FF;
    --green:#2FC177; --coral:#FF6B6B; --sun:#FFC93C;
    --radius:24px; --radius-sm:16px; --pill:100px;
    --shadow-sm:0 10px 30px -16px rgba(20,32,64,.28);
    --shadow:0 24px 60px -30px rgba(20,32,64,.35);
    --edge: clamp(var(--s20), 5vw, var(--s40));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg-2); color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100dvh; line-height:1.5;
    /* rejilla fina de marca (como el hero de la landing) */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:44px 44px;
  }

  /* ---------- esqueleto ---------- */
  .wrap{
    max-width:680px; margin-inline:auto; padding:var(--edge);
    display:flex; flex-direction:column; gap:var(--s48);
  }
  #body{display:flex; flex-direction:column; gap:var(--s48);}

  /* ---------- entrada ---------- */
  .gate{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:var(--edge);}
  .gate form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:var(--s24);
    background:var(--bg); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); padding:var(--s32);}
  .gate .fields{display:flex; flex-direction:column; gap:var(--s10);}
  .gate .logo{display:flex; align-items:center; justify-content:center; gap:var(--s10);}
  .gate .logo img{width:30px; height:30px; border-radius:8px;}
  .gate h1{font-weight:800; font-size:19px; letter-spacing:-.02em; text-align:center;}
  input[type=password],input[type=number]{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:var(--s12) var(--s16); font:inherit; font-size:15px;
    outline:none; transition:border-color .18s ease, box-shadow .18s ease;
  }
  input::placeholder{color:var(--muted-2);}
  input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-050);}
  .btn{
    background:var(--blue); color:#fff; border:0; border-radius:12px;
    padding:var(--s12) var(--s16); font:inherit; font-weight:700; font-size:15px;
    cursor:pointer; transition:background .18s ease, transform .1s ease;
  }
  .btn:hover{background:var(--blue-600);} .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.5; cursor:default;}
  .err{color:var(--coral); font-size:13px; min-height:18px; text-align:center; font-weight:500;}

  /* ---------- cabecera ---------- */
  .top{display:flex; align-items:center; justify-content:space-between; gap:var(--s16);}
  .brand{display:flex; align-items:center; gap:var(--s8); font-size:15px; font-weight:800;
    letter-spacing:-.02em; color:var(--ink);}
  .brand img{width:24px; height:24px; border-radius:7px;}
  .ghost{background:none; border:0; color:var(--muted); font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; transition:color .18s ease;}
  .ghost:hover{color:var(--ink);}

  /* ---------- 1 · el veredicto ---------- */
  .hero{display:flex; flex-direction:column; align-items:flex-start; gap:var(--s16);}
  .period{font-size:13px; color:var(--muted);}
  .period b{color:var(--ink); font-weight:700;}
  /* píldora de veredicto — igual que la píldora sobre el titular de la landing */
  .verdict{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    padding:var(--s6) var(--s12); border-radius:var(--pill);}
  .verdict.good{background:var(--green); color:#08351f;}
  .verdict.ok{background:var(--sun); color:#4a3600;}
  .verdict.bad{background:var(--coral); color:#fff;}
  .verdict.blind,.verdict.none{background:var(--bg); border:1px solid var(--line); color:var(--muted);}
  .hero-num{
    font-weight:800; font-size:clamp(64px,15vw,104px); line-height:.9; letter-spacing:-.045em;
    color:var(--ink); display:flex; align-items:baseline; gap:var(--s4);
  }
  .hero-num .cur{font-size:.34em; font-weight:700; letter-spacing:-.02em; color:var(--muted);}
  .hero-text{display:flex; flex-direction:column; gap:var(--s8);}
  .hero-say{font-weight:700; font-size:clamp(20px,4.2vw,26px);
    line-height:1.24; letter-spacing:-.02em; max-width:20ch; text-wrap:balance;}
  .hero-sub{font-size:14px; color:var(--muted); font-weight:500;}
  .hero-sub .pos{color:#1f9d5b; font-weight:700;} .hero-sub .neg{color:var(--coral); font-weight:700;}

  /* ---------- Card: componente compartido (dinero y funnel) ----------
     Card blanca flotante como las de la landing: borde + sombra suave. */
  .panel{display:flex; flex-direction:column; gap:var(--s16);}
  .card{display:flex; background:var(--bg); border:1px solid var(--line);
    border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); overflow:hidden;}
  .cell{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--s8);
    padding:var(--s24) var(--s20);}
  .cell + .cell{border-left:1px solid var(--line);}
  .k{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700;
    display:flex; align-items:center; gap:var(--s6);}
  .v{font-weight:800; font-size:29px; letter-spacing:-.03em; color:var(--ink);}
  .ic{width:13px; height:13px; flex:none;}
  .ic.out{color:var(--coral);}   /* sale dinero */
  .ic.in{color:#1f9d5b;}         /* entra dinero */
  h2{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700;}

  /* ---------- el embudo (dentro de Card) ---------- */
  .flow{display:flex; align-items:flex-start; gap:var(--s8);}
  .step,.arrow{display:flex; flex-direction:column; align-items:center; gap:var(--s6);}
  .step{flex:1; min-width:0;}
  .arrow{flex:none; width:28px;}
  .step .n,.arrow span{height:30px; display:flex; align-items:center; justify-content:center;}
  .step .n{font-weight:800; font-size:25px; letter-spacing:-.03em; color:var(--ink);}
  .arrow span{font-size:15px; color:var(--muted-2);}
  .step .l{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .arrow i{font-style:normal; font-size:10px; color:var(--muted-2); font-weight:600;}

  /* ---------- los creativos ---------- */
  .entries{display:flex; flex-direction:column; background:var(--bg); border:1px solid var(--line);
    border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); padding-inline:var(--s20);}
  .entry{display:flex; align-items:center; gap:var(--s16); padding-block:var(--s16);}
  .entry + .entry{border-top:1px solid var(--line);}
  .entry img,.entry .noimg{flex:none; width:50px; height:63px; border-radius:10px; object-fit:cover;
    display:block; background:var(--bg-2); border:1px solid var(--line);}
  .entry-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--s4);}
  .entry-name{font-size:15px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
    display:flex; align-items:center; gap:var(--s8);}
  .entry-meta{font-size:13px; color:var(--muted); font-weight:500;}
  .entry-sales{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:var(--s4);}
  .entry-sales b{font-weight:800; font-size:25px; letter-spacing:-.03em; line-height:1; color:var(--ink);}
  .entry-sales small{font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted-2); font-weight:600;}
  .entry.win .entry-sales b{color:#1f9d5b;}
  .entry.zero{opacity:.55;}
  .tag{font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:#08351f; background:var(--green); padding:var(--s3) var(--s6); border-radius:var(--pill);}

  /* ---------- conexiones ---------- */
  .sources{display:flex; flex-direction:column; gap:var(--s10);}
  .src{display:flex; align-items:center; gap:var(--s8); font-size:13px;}
  .dot{flex:none; width:7px; height:7px; border-radius:50%; background:var(--muted-2);}
  .dot.ok{background:var(--green); box-shadow:0 0 0 3px rgba(47,193,119,.16);}
  .dot.bad{background:var(--coral); box-shadow:0 0 0 3px rgba(255,107,107,.16);}
  .src-n{color:var(--ink); font-weight:600;}
  .src.off .src-n{color:var(--muted); font-weight:500;}
  .src-d{color:var(--muted-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- pie ---------- */
  .foot{display:flex; justify-content:space-between; align-items:center; gap:var(--s16);
    padding-top:var(--s24); border-top:1px solid var(--line);}
  .stamp{font-size:12px; color:var(--muted-2); font-weight:500;}
  .empty{font-weight:700; font-size:22px; color:var(--muted); line-height:1.4;
    letter-spacing:-.01em; padding-block:var(--s60);}

  /* ---------- una sola entrada orquestada (solo la primera vez) ---------- */
  [data-r]{opacity:0; transform:translateY(12px); animation:rise .62s cubic-bezier(.22,1,.36,1) forwards;}
  [data-r="1"]{animation-delay:.04s} [data-r="2"]{animation-delay:.12s}
  [data-r="3"]{animation-delay:.20s} [data-r="4"]{animation-delay:.28s} [data-r="5"]{animation-delay:.36s}
  @keyframes rise{to{opacity:1; transform:none;}}
  body.ready [data-r]{animation:none; opacity:1; transform:none;}
  @media (prefers-reduced-motion:reduce){[data-r]{animation:none; opacity:1; transform:none;}}
  .hide{display:none !important;}

  @media (max-width:430px){
    .card{flex-direction:column;}
    .cell + .cell{border-left:0; border-top:1px solid var(--line);}
    .entry{gap:var(--s12);} .entry img,.entry .noimg{width:44px; height:55px;}
    /* funnel HORIZONTAL con scroll PROPIO (el body nunca hace scroll horizontal) */
    .flow{overflow-x:auto; -webkit-overflow-scrolling:touch; gap:var(--s8); padding-bottom:var(--s6);}
    .step{flex:none; min-width:60px;}
    .arrow{flex:none;}
    .step .n,.arrow span{height:28px;}
    .step .n{font-size:22px;}
    .step .l{font-size:9px; letter-spacing:.05em; white-space:nowrap;}
    .arrow span{font-size:13px;}
    .arrow i{font-size:9px;}
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm">
    <div class="logo"><img src="/assets/images/favicon.svg" alt=""><h1>La Mirada Creativa</h1></div>
    <div class="fields">
      <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <button class="btn" type="submit" id="go">Entrar</button>
      <div class="err" id="gateErr"></div>
    </div>
  </form>
</div>

<main class="wrap hide" id="app">
  <div class="top">
    <span class="brand"><img src="/assets/images/favicon.svg" alt="">La Mirada Creativa</span>
    <button class="ghost" id="out">Salir</button>
  </div>
  <div id="body"></div>
  <div class="foot">
    <span class="stamp" id="stamp"></span>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const API = '/.netlify/functions/metrics-api';
const AUTH = '/.netlify/functions/metrics-login';
const REFRESH_MS = 60000; // el panel se refresca solo; ver nota sobre latencia de Meta

const eur = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString('es-ES',
  { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €';
const one = (n) => (Math.round((n || 0) * 10) / 10).toLocaleString('es-ES',
  { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const day = (iso) => { if (!iso) return ''; const p = iso.split('-'); return parseInt(p[2], 10) + ' ' + MES[parseInt(p[1], 10) - 1]; };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : 0);

// Iconos Lucide, inline (trazo 1.5 = fino). Sin CDN: cero dependencias.
const SVG = (paths, cls) => '<svg class="ic ' + cls + '" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ' +
  'aria-hidden="true">' + paths + '</svg>';
const ICON = {
  arrowUp: (c) => SVG('<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>', c),
  arrowDown: (c) => SVG('<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>', c),
};

// El nombre trae prefijos técnicos ("LMC69 · ABC · B testimonio"). Solo importa la idea.
const clean = (n) => String(n || '').split('·').pop().trim() || String(n || '');

// Las ventas salen de Stripe. Si Stripe no responde, "0 ventas" NO significa
// "no vende": significa "no lo sé". Un panel que confunde ambas cosas miente.
// Devuelve el 'kind' (color de la píldora) + texto de la píldora + frase.
function verdict(cp, salesOk) {
  if (!salesOk) return { kind: 'blind', pill: 'Sin datos', say: 'No puedo leer las ventas: Stripe no responde.' };
  if (!cp.orders) {
    return cp.spend > 0
      ? { kind: 'bad', pill: 'En pérdida', say: 'Todavía no ha vendido nada.' }
      : { kind: 'none', pill: 'Sin datos', say: 'Aún sin datos.' };
  }
  const r = cp.roas;
  if (r >= 1.5) return { kind: 'good', pill: 'Rentable', num: r, say: 'Por cada euro invertido, esto es lo que vuelve.' };
  if (r >= 1)   return { kind: 'ok', pill: 'Justo', num: r, say: 'Se sostiene, pero por poco.' };
  return { kind: 'bad', pill: 'En pérdida', num: r, say: 'Cada euro que entra vuelve incompleto.' };
}

// Estado de conexión de cada herramienta que alimenta el panel.
// verde = trae datos · coral = falla · gris = no configurada (opcional)
function sourcesHTML(sources) {
  if (!sources || !sources.length) return '';
  const rows = sources.map((s) => {
    const cls = s.ok ? 'ok' : (s.optional ? '' : 'bad');
    return '<div class="src ' + (s.ok ? '' : 'off') + '">' +
      '<i class="dot ' + cls + '"></i>' +
      '<span class="src-n">' + esc(s.name) + '</span>' +
      (s.ok ? '' : '<span class="src-d">' + esc(s.detail || 'sin conexión') + '</span>') +
    '</div>';
  }).join('');
  return '<section class="panel" data-r="5"><h2>Conexiones</h2>' +
         '<div class="sources">' + rows + '</div></section>';
}

function render(b) {
  const cp = b.campaignPeriod;

  $('stamp').textContent = 'Actualizado ' + new Date(b.generatedAt).toLocaleTimeString('es-ES',
    { hour: '2-digit', minute: '2-digit' });

  const sources = sourcesHTML(b.sources);

  if (!cp || !cp.ads || !cp.ads.length) {
    $('body').innerHTML = '<div class="empty" data-r="1">No hay creativos activos.<br>No hay campaña que medir.</div>' + sources;
    return;
  }

  // ¿Podemos fiarnos del dato de ventas? Sale de Stripe.
  const stripeSrc = (b.sources || []).find((s) => s.id === 'stripe');
  const salesOk = !stripeSrc || stripeSrc.ok;

  const v = verdict(cp, salesOk);
  const ads = cp.ads.slice().sort((a, z) => (z.purchases - a.purchases) || (z.spend - a.spend));
  const best = salesOk && ads[0] && ads[0].purchases > 0 ? ads[0].id : null;

  // "×1,2" — el multiplicador delante, como se lee en español. Número en tinta;
  // el color del veredicto va en la píldora de arriba (como el tag de la landing).
  const heroNum = v.num != null
    ? '<span class="hero-num"><span class="cur">×</span>' + one(v.num) + '</span>'
    : (v.kind === 'blind'
        ? '<span class="hero-num">—</span>'
        : '<span class="hero-num">' + cp.orders + '<span class="cur"> ventas</span></span>');

  const profit = cp.profit >= 0
    ? '<span class="pos">+' + eur(cp.profit) + '</span>'
    : '<span class="neg">' + eur(cp.profit) + '</span>';
  const heroSub = v.kind === 'blind'
    ? 'El gasto sí es real; las ventas no se pueden confirmar.'
    : cp.orders + ' ' + (cp.orders === 1 ? 'venta' : 'ventas') + ' · ' + profit;

  const step = (n, l) => '<div class="step"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
  const arrow = (a, b2) => '<div class="arrow"><span>→</span><i>' + pctOf(a, b2) + '%</i></div>';

  const rows = ads.map((a) =>
    '<div class="entry ' + (a.id === best ? 'win' : '') + ' ' + (a.purchases === 0 ? 'zero' : '') + '">' +
      (a.thumb ? '<img src="' + esc(a.thumb) + '" alt="" loading="lazy">' : '<div class="noimg"></div>') +
      '<div class="entry-info">' +
        '<div class="entry-name">' + esc(clean(a.name)) + (a.id === best ? '<span class="tag">gana</span>' : '') + '</div>' +
        '<div class="entry-meta">' + eur(a.spend) + ' · ' + a.landingViews + ' visitas' +
          (a.ctr != null ? ' · CTR ' + one(a.ctr) + '%' : '') + '</div>' +
      '</div>' +
      '<div class="entry-sales"><b>' + a.purchases + '</b>' +
        '<small>' + (a.purchases === 1 ? 'venta' : 'ventas') + '</small></div>' +
    '</div>').join('');

  $('body').innerHTML =
    // 1 · el veredicto
    '<section class="hero" data-r="1">' +
      '<p class="period">Creativos actuales · desde <b>' + day(cp.since) + '</b> · día <b>' + cp.days + '</b></p>' +
      '<span class="verdict ' + v.kind + '">' + esc(v.pill) + '</span>' +
      heroNum +
      '<div class="hero-text">' +
        '<p class="hero-say">' + esc(v.say) + '</p>' +
        '<p class="hero-sub">' + heroSub + '</p>' +
      '</div>' +
    '</section>' +

    // 2 · el dinero
    '<section class="card" data-r="2">' +
      '<div class="cell"><div class="k">' + ICON.arrowUp('out') + 'Invertido</div>' +
        '<div class="v">' + eur(cp.spend) + '</div></div>' +
      '<div class="cell"><div class="k">' + ICON.arrowDown('in') + 'Ingresado</div>' +
        '<div class="v">' + (salesOk ? eur(cp.revenue) : '—') + '</div></div>' +
    '</section>' +

    // 3 · el funnel — manda sobre los creativos: dice DÓNDE se rompe
    '<section class="panel" data-r="3"><h2>Funnel</h2>' +
      '<div class="card"><div class="cell"><div class="flow">' +
        step(cp.linkClicks, 'Clics') + arrow(cp.landingViews, cp.linkClicks) +
        step(cp.landingViews, 'Visitas') + arrow(cp.checkouts, cp.landingViews) +
        step(cp.checkouts, 'Al pago') + (salesOk ? arrow(cp.orders, cp.checkouts) : '<div class="arrow"><span>→</span><i>—</i></div>') +
        step(salesOk ? cp.orders : '—', 'Compran') +
      '</div></div></div>' +
    '</section>' +

    // 4 · los creativos
    '<section class="panel" data-r="4"><h2>Creativos</h2>' +
      '<div class="entries">' + rows + '</div>' +
    '</section>' +

    // 5 · conexiones
    sources;
}

async function load() {
  const r = await fetch(API + '?range=30', { credentials: 'include' });
  if (r.status === 401) {
    $('app').classList.add('hide'); $('gate').style.display = 'flex';
    document.body.classList.remove('ready');
    return;
  }
  const b = await r.json();
  $('gate').style.display = 'none';
  $('app').classList.remove('hide');
  render(b);
  // a partir del primer pintado, los refrescos son silenciosos (sin re-animar)
  requestAnimationFrame(() => document.body.classList.add('ready'));
}

// El panel se mantiene solo: refresca en segundo plano y al volver a la pestaña.
// (La venta entra al instante vía Stripe; el gasto de Meta lleva su propia latencia.)
setInterval(() => { if (!document.hidden && !$('app').classList.contains('hide')) load(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$('app').classList.contains('hide')) load();
});

$('gateForm').onsubmit = async (e) => {
  e.preventDefault();
  $('go').disabled = true; $('gateErr').textContent = '';
  try {
    const r = await fetch(AUTH, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'include', body: JSON.stringify({ password: $('pw').value }) });
    if (!r.ok) throw new Error('Contraseña incorrecta');
    await load();
  } catch (err) { $('gateErr').textContent = err.message; }
  $('go').disabled = false;
};

$('out').onclick = async () => {
  try {
    await fetch(AUTH, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'include', body: JSON.stringify({ action: 'logout' }) });
  } catch (e) {}
  location.reload();
};

load();
</script>
</body>
</html>
