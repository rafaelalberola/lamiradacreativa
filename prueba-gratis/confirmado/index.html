        <a href="/app/" class="nav-hide-mobile nav-login">Acceder</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
          <span class="material-symbols-sharp">menu</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-header">
      <a href="/" class="logo"><img src="../../assets/images/logo.jpg" alt="Logo" class="logo-img">La Mirada Creativa</a>
      <button class="mobile-nav-close" id="mobileNavClose" aria-label="Cerrar menú">
        <span class="material-symbols-sharp">close</span>
      </button>
    </div>
    <div class="mobile-nav-content">
      <div class="mobile-nav-links">
        <a href="/" class="mobile-nav-link">Programa completo</a>
        <a href="/app/" class="mobile-nav-link">Acceder</a>
      </div>
    </div>
  </div>

  <!-- Confirmation -->
  <section class="ft-confirm">
    <div class="container">
      <span class="ft-confirm-icon">&#10003;</span>
      <h1>Listo. Revisa tu email.</h1>
      <p>Te hemos enviado tu primer ejercicio.<br>Revisa tu bandeja de entrada (y spam, por si acaso).</p>
    </div>
  </section>

  <!-- Scripts -->
  <script src="../../js/main.js?v=20260215"></script>

  <!-- Mobile nav toggle (inline) -->
  <script>
    (function() {
      var toggle = document.getElementById('menuToggle');
      var nav = document.getElementById('mobileNav');
      var close = document.getElementById('mobileNavClose');
      if (toggle && nav) {
        toggle.addEventListener('click', function() { nav.classList.add('active'); });
      }
      if (close && nav) {
        close.addEventListener('click', function() { nav.classList.remove('active'); });
      }
      if (nav) {
        nav.querySelectorAll('a').forEach(function(a) {
          a.addEventListener('click', function() { nav.classList.remove('active'); });
        });
      }
    })();
  </script>
